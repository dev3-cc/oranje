# Cómo se construye la imagen del API en Cloud Build.
#
# Existe porque `gcloud builds submit --tag` exige el Dockerfile en la raíz del
# contexto, y el nuestro vive en `apps/api/`. El contexto SÍ tiene que ser la
# raíz del monorepo: ahí están el lockfile y los package.json de los otros
# paquetes, y sin ellos `--frozen-lockfile` falla.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=${_IMAGEN}
      - . # el contexto es la raíz, no apps/api

images:
  - ${_IMAGEN}

options:
  # El monorepo instala cientos de paquetes; en la máquina por omisión el build
  # se va cerca del límite de tiempo
  machineType: E2_HIGHCPU_8
  # Sin bucket de logs propio, Cloud Build exige decir dónde escribe
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
