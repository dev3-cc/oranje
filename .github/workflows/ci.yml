# Estándares de Desarrollo §9: lint -> typecheck -> test -> build en cada PR.
# Una regla que solo vive en un documento se rompe sola.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # prisma.config.ts lee MIGRATE_DATABASE_URL, no DATABASE_URL: las
      # migraciones corren como el dueño de los esquemas, no como la aplicación.
      # No se conecta a nada — `validate` solo exige que la variable exista
      - name: Esquema de Prisma
        run: pnpm -F @oranje/api exec prisma validate
        env:
          MIGRATE_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
