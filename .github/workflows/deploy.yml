# Despliegue del API. La rama se llama como su ambiente (§1): staging ->
# oranje-staging, main -> oranje-prod.
#
# UN SOLO ARTEFACTO: la imagen se construye una vez en `staging` y producción
# reutiliza ese digest. Reconstruirla haría que lo probado y lo desplegado
# fueran dos binarios distintos. La excepción: si ningún commit con imagen en
# staging trae el mismo código del API (un hotfix o un cherry-pick directo a
# main), producción construye la suya en vez de promover una equivocada.
name: Desplegar

on:
  push:
    branches: [staging, main]

# Uno a la vez por ambiente: dos merges seguidos competirían por la misma
# revisión de Cloud Run.
#
# En main, el despliegue nuevo CANCELA al anterior. Un despliegue esperando la
# aprobación de `production` cuenta como en curso y bloqueaba a todos los que
# venían detrás: el 2026-10-22 uno del #240 llevaba 23 h sin aprobar y el del
# #246 esperó 19 min en la fila hasta que alguien lo aprobó — y entonces
# desplegó primero el viejo. El nuevo commit de main ya trae todo lo del
# anterior, así que cancelarlo no pierde nada; si lo alcanza a medio desplegar,
# las migraciones son idempotentes y Cloud Run termina la revisión que ya pidió
# antes de que el nuevo la reemplace. En staging no se cancela: ahí cada merge
# construye su imagen y no hay aprobación que espere.
concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  # write: el último paso del deploy a producción deja un tag `prod-…` en el
  # repo como registro de rollback (Estándares §11); con read el push del tag
  # daba 403 y el primer deploy quedó marcado en rojo ya con todo servido.
  contents: write
  # Workload Identity Federation: GitHub firma un token y GCP lo cambia por
  # credenciales, así no hay llave de cuenta de servicio guardada como secreto
  id-token: write

jobs:
  desplegar:
    runs-on: ubuntu-latest

    # El ambiente de GitHub aporta las variables y permite exigir aprobación
    # manual antes de producción
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      REGION: us-central1
      SERVICIO: oranje-api
      REPOSITORIO: oranje

    steps:
      # Historial completo: en main hay que caminar varios segundos padres
      # para promover (ver el paso "Promover la imagen probada en staging").
      # fetch-depth: 2 se quedaba corto en cuanto el enlace a staging tenía
      # más de un nivel de profundidad (2026-10-10).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Autenticar contra GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      # No se instala gcloud: la imagen del runner ya lo trae, y
      # `auth` deja las credenciales en CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE,
      # que el gcloud preinstalado respeta. setup-gcloud tardaba ~20s en cada
      # despliegue reinstalando lo que ya estaba.
      #
      # El precio: la version de gcloud pasa a ser la que traiga la imagen del
      # runner, que GitHub actualiza sin avisar. Si algun dia un flag deja de
      # existir, el despliegue se cae en rojo y Cloud Run sigue sirviendo la
      # revision anterior — entonces toca volver a poner setup-gcloud con la
      # version fijada.

      - name: Nombre de la imagen
        id: imagen
        run: |
          echo "ruta=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REPOSITORIO/$SERVICIO" >> "$GITHUB_OUTPUT"

      # --- staging: construye ---
      - name: Construir y publicar la imagen
        if: github.ref_name == 'staging'
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions "_IMAGEN=${{ steps.imagen.outputs.ruta }}:${{ github.sha }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      # --- main: promueve lo que ya se probó; si no existe, lo construye ---
      #
      # El PR staging → main se cierra con un merge commit (la protección de
      # rama no deja hacer fast-forward), así que el SHA de main no existe en
      # staging: la imagen probada es la de su SEGUNDO padre, que es la punta
      # de staging al mergear. Se prueba primero el SHA tal cual (por si algún
      # día el merge fuera fast-forward) y luego el padre.
      #
      # Una imagen de otro commit solo sirve si el código del API es IDÉNTICO
      # (mismas carpetas que entran al build, ver CONTEXTO). Antes bastaba con
      # que el ancestro tuviera imagen: el 2026-10-22 el #246 (cherry-pick
      # directo a main, que staging nunca construyó) promovió la del #237 con
      # la etiqueta del commit nuevo — la web quedó nueva, el API viejo y la
      # migración sin correr, todo en verde. Si ningún ancestro trae el mismo
      # código, se construye la imagen de ESTE commit en producción: un
      # hotfix directo a main deja de ser un callejón.
      - name: Promover la imagen probada en staging
        if: github.ref_name == 'main'
        id: promover
        run: |
          ORIGEN="${{ vars.STAGING_PROJECT_ID }}"
          DESTINO="${{ vars.GCP_PROJECT_ID }}"
          RUTA_ORIGEN="$REGION-docker.pkg.dev/$ORIGEN/$REPOSITORIO/$SERVICIO"
          RUTA_DESTINO="$REGION-docker.pkg.dev/$DESTINO/$REPOSITORIO/$SERVICIO:${{ github.sha }}"
          # Lo que decide los bytes de la imagen: el Dockerfile copia todo el
          # repo, instala con el lockfile y compila solo @oranje/api.
          CONTEXTO="apps/api packages package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc tsconfig.base.json cloudbuild.yaml"

          # Caminar solo "segundos padres" en cadena se rompe en cuanto un
          # commit intermedio no es un merge (p. ej. un hotfix lineal
          # encima de main, como pasó el 2026-10-10): esa rama no tiene
          # segundo padre y el camino hacia staging se corta ahí aunque
          # siga siendo ancestro por el primer padre. Se busca en TODOS
          # los ancestros recientes, no solo en una columna.
          #
          # El cruce se hace AQUÍ, con una sola llamada: se traen los tags
          # del repositorio de staging (163 hoy, ~2s) y se busca el primer
          # ancestro que tenga uno. Antes se preguntaba por cada candidato
          # por separado y cada pregunta era un viaje a la red: ~38s en
          # llegar al que servía.
          TAGS=$(mktemp)
          gcloud artifacts docker tags list "$RUTA_ORIGEN" \
            --format='value(tag,version)' \
            --project "$ORIGEN" > "$TAGS"

          DIGEST=""
          for CANDIDATO in $(git rev-list --max-count=50 "${{ github.sha }}"); do
            ENCONTRADO=$(awk -v c="$CANDIDATO" '$1 == c { print $2; exit }' "$TAGS")
            [ -z "$ENCONTRADO" ] && continue
            # shellcheck disable=SC2086 # CONTEXTO es una lista de rutas a propósito
            if git diff --quiet "$CANDIDATO" "${{ github.sha }}" -- $CONTEXTO; then
              DIGEST="$ENCONTRADO"
              echo "Imagen probada en staging: $CANDIDATO → $DIGEST (mismo código del API)"
              break
            fi
            echo "La imagen de $CANDIDATO no sirve: su código del API no es el de ${{ github.sha }}"
          done

          if [ -n "$DIGEST" ]; then
            gcloud container images add-tag "$RUTA_ORIGEN@$DIGEST" "$RUTA_DESTINO" --quiet
          else
            echo "::warning::Ningún ancestro con imagen en staging trae este código del API: se construye la imagen de ${{ github.sha }} en producción."
            gcloud builds submit \
              --config cloudbuild.yaml \
              --substitutions "_IMAGEN=$RUTA_DESTINO" \
              --project "$DESTINO"
          fi

      # El paso más caro del despliegue y el que casi nunca tiene algo que
      # hacer: de los últimos 40 commits de staging solo 2 tocaron
      # `prisma/migrations`, y el job tarda entre 2 y 4 minutos levantándose
      # para no aplicar nada (medido: 256s el 2026-10-12, más que construir
      # la imagen).
      #
      # Se compara lo que está SIRVIENDO contra este commit, y de qué commit
      # salió lo que sirve lo dice la etiqueta `commit-sha` que el propio
      # despliegue le pone a la revisión (ver el paso de Cloud Run).
      #
      # EL SEGURO ES CORRERLAS. Cualquier duda —no hay servicio todavía, la
      # revisión no trae la etiqueta, el commit no está en el historial,
      # falla gcloud— y se corren: equivocarse hacia «córrelas» cuesta
      # minutos; hacia «sáltalas» deja una revisión nueva hablándole a una
      # base sin migrar.
      #
      # Saltar es seguro aunque la revisión que sirve esté atrasada: si un
      # despliegue aplicó migraciones y luego falló al servir, las
      # migraciones ya están puestas y `migrate deploy` es idempotente.
      - name: ¿Hay migraciones nuevas?
        id: migraciones
        run: |
          # De dónde sale el commit que sirve: de la etiqueta `commit-sha`
          # que este mismo workflow le pone a cada revisión. NO del tag de la
          # imagen: Cloud Run resuelve el tag a digest al desplegar y guarda
          # `...@sha256:...`, que es el digest de la imagen y no un commit de
          # git (verificado el 2026-10-12 contra los dos ambientes).
          #
          # Las revisiones anteriores a este cambio no tienen la etiqueta, así
          # que el primer despliegue corre las migraciones y a partir del
          # siguiente ya hay con qué comparar.
          SIRVIENDO=""
          REV=$(gcloud run services describe "$SERVICIO" \
            --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          if [ -n "$REV" ]; then
            SIRVIENDO=$(gcloud run revisions describe "$REV" \
              --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" \
              --format='value(metadata.labels["commit-sha"])' 2>/dev/null || true)
          fi

          DECISION="si"
          if [ -z "$SIRVIENDO" ]; then
            RAZON="la revisión que sirve no dice de qué commit salió"
          elif ! git cat-file -e "${SIRVIENDO}^{commit}" 2>/dev/null; then
            RAZON="el commit que sirve ($SIRVIENDO) no está en este historial"
          elif git diff --quiet "$SIRVIENDO" "${{ github.sha }}" -- apps/api/prisma/migrations; then
            DECISION="no"
            RAZON="ningún archivo de prisma/migrations cambió desde $SIRVIENDO"
          else
            RAZON="hay cambios en prisma/migrations desde $SIRVIENDO"
            git diff --name-only "$SIRVIENDO" "${{ github.sha }}" -- apps/api/prisma/migrations
          fi

          echo "correr=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Correr migraciones: $DECISION — $RAZON"

          # En producción todavía se corren siempre: la decisión se imprime
          # para poder comprobar en los logs que habría acertado, antes de
          # dejarla apagar el paso (Hugo, 2026-10-12: «probado en staging
          # antes de tocar producción»). Cuando varios despliegues de
          # producción muestren «habría saltado» y las migraciones no tenían
          # nada, quitar este bloque y la condición de rama del paso
          # siguiente.
          if [ "${{ github.ref_name }}" = "main" ] && [ "$DECISION" = "no" ]; then
            echo "::notice::En producción se corren igual por ahora. Habría saltado: $RAZON"
          fi

      # Antes de la revisión nueva y con el usuario dueño del esquema. Expandir y
      # contraer (BD §8) mantiene vivo al código viejo durante el despliegue.
      #
      # Se entra a apps/api porque prisma.config.ts declara sus rutas relativas
      # a esa carpeta, y desde /app Prisma no encuentra ni la config ni la url.
      # Sin reintentos: una migración que falla no mejora al repetirla, y cada
      # intento tarda minutos.
      - name: Migraciones
        if: github.ref_name == 'main' || steps.migraciones.outputs.correr == 'si'
        run: |
          gcloud run jobs deploy "$SERVICIO-migrate" \
            --image "$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REPOSITORIO/$SERVICIO:${{ github.sha }}" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-secrets "MIGRATE_DATABASE_URL=oranje-migrate-database-url:latest" \
            --command sh \
            --args "-c,cd apps/api && exec node node_modules/prisma/build/index.js migrate deploy" \
            --max-retries 0 \
            --execute-now \
            --wait

      # Público en los dos ambientes (decisión de Hugo, 2026-09-19).
      #
      # No es un descuido: el IAM de Cloud Run exige un token de Google en
      # `Authorization`, que es la MISMA cabecera donde viaja nuestro JWT — y un
      # navegador o la app móvil no pueden producir un token de Google. O sea que
      # con IAM el producto no funciona: la puerta es el guard, no el IAM.
      # El Load Balancer con Cloud Armor (D-04) queda como endurecimiento
      # posterior; hasta el 2026-09-19 producción se desplegaba cerrada y por
      # eso ningún navegador habría podido llegar al API.
      - name: Exposición según el ambiente
        id: acceso
        run: |
          echo "flag=--allow-unauthenticated" >> "$GITHUB_OUTPUT"

      # Salida con IP fija, solo en producción (decisión de Hugo, 2026-09-15):
      # cPanel de A2 solo autoriza direcciones estáticas y desde Cloud Run la
      # IP cambia en cada petición. El tráfico de salida pasa por la red
      # `default` y su Cloud NAT (`oranje-nat`, IP reservada `oranje-api-egress`).
      # Staging sigue sin NAT a propósito: son ~36 USD/mes por ambiente y ahí
      # Correos corporativos se queda sin probar.
      - name: Red de salida según el ambiente
        id: red
        run: |
          if [ "${{ vars.APP_ENV }}" = "production" ]; then
            echo "flag=--network default --subnet default --vpc-egress all-traffic" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Las variables van con delimitador ^|^: --set-env-vars separa por coma
      # y CORS_ORIGINS es una lista separada por comas. ^@^ se descartó el
      # 2026-09-15 porque PUBSUB_SERVICE_ACCOUNT es un correo de cuenta de
      # servicio que trae un @ dentro del propio valor y rompía el parseo de
      # gcloud ("Bad syntax for dict arg"); | no aparece en ningún valor hoy.
      - name: Desplegar en Cloud Run
        run: |
          gcloud run deploy "$SERVICIO" \
            --image "$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/$REPOSITORIO/$SERVICIO:${{ github.sha }}" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances "${{ vars.CLOUDSQL_INSTANCE }}" \
            --set-env-vars "^|^APP_ENV=${{ vars.APP_ENV }}|NODE_ENV=production|AUTH_ISSUER_URL=${{ vars.AUTH_ISSUER_URL }}|AUTH_AUDIENCE=${{ vars.AUTH_AUDIENCE }}|CORS_ORIGINS=${{ vars.CORS_ORIGINS }}|COOKIE_SAME_SITE=${{ vars.COOKIE_SAME_SITE }}|STORAGE_BUCKET=${{ vars.STORAGE_BUCKET }}|COOKIE_SECURE=true|LOG_LEVEL=info|GOOGLE_MAPS_BROWSER_KEY=${{ vars.GOOGLE_MAPS_BROWSER_KEY }}|FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}|CPANEL_HOST=${{ vars.CPANEL_HOST }}|CPANEL_DOMAIN=${{ vars.CPANEL_DOMAIN }}|PUBSUB_TOPIC_NOTIFICATIONS=${{ vars.PUBSUB_TOPIC_NOTIFICATIONS }}|PUBSUB_AUDIENCE=${{ vars.PUBSUB_AUDIENCE }}|PUBSUB_SERVICE_ACCOUNT=${{ vars.PUBSUB_SERVICE_ACCOUNT }}|SCHEDULER_AUDIENCE=${{ vars.SCHEDULER_AUDIENCE }}|SCHEDULER_SERVICE_ACCOUNT=${{ vars.SCHEDULER_SERVICE_ACCOUNT }}|MAIL_SMTP_HOST=${{ vars.MAIL_SMTP_HOST }}|MAIL_SMTP_PORT=${{ vars.MAIL_SMTP_PORT }}|MAIL_SMTP_USER=${{ vars.MAIL_SMTP_USER }}|MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}|MAIL_FROM_EMAIL=${{ vars.MAIL_FROM_EMAIL }}" \
            --set-secrets "DATABASE_URL=oranje-database-url:latest,JWT_PRIVATE_KEY=oranje-jwt-private-key:latest,JWT_PUBLIC_KEY=oranje-jwt-public-key:latest,GOOGLE_PLACES_API_KEY=oranje-places-api-key:latest,CPANEL_API_TOKEN=oranje-cpanel-api-token:latest,MAIL_SMTP_PASSWORD=oranje-mail-smtp-password:latest" \
            --update-labels "commit-sha=${{ github.sha }}" \
            --min-instances "${{ vars.MIN_INSTANCES }}" \
            --max-instances "${{ vars.MAX_INSTANCES }}" \
            ${{ steps.acceso.outputs.flag }} \
            ${{ steps.red.outputs.flag }}

      # Si el contenedor no arranca, la validación de entorno lo tumba y este paso
      # falla. Cloud Run deja sirviendo la revisión anterior
      - name: Verificar que la revisión quedó sirviendo
        run: |
          gcloud run services describe "$SERVICIO" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.conditions[0].status)' | grep -q True

      - name: Tag de la versión desplegada a producción
        if: github.ref_name == 'main'
        run: |
          git tag "prod-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          git push origin --tags
